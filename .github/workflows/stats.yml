name: Refresh activity card

on:
  schedule:
    - cron: "23 4 * * *"   # daily, 04:23 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

concurrency:
  group: refresh-activity-card
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Fetch public activity
        run: python scripts/fetch_stats.py
        env:
          # Optional: add a STATS_TOKEN secret (read:user) to include more data.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Render card
        run: python scripts/build.py stats

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stats.json assets/stats.svg
          git diff --cached --quiet || { git commit -m "chore: refresh activity card"; git push; }
